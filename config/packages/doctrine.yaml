doctrine:
  dbal:
    connections:
      default:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        wrapper_class: App\Connection\MultiDbConnectionWrapper
      upc:
        url: '%env(resolve:DATABASE_URL_UPC)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        wrapper_class: App\Connection\MultiDbConnectionWrapper
      lol:
        url: '%env(resolve:DATABASE_URL_LOL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        wrapper_class: App\Connection\MultiDbConnectionWrapper

  orm:
    entity_managers:
      default:
        connection: default
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App
      upc:
        connection: upc
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App
      lol:
        connection: lol
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          App:
            is_bundle: false
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Entity'
            alias: App

when@test:
  doctrine:
    dbal:
    # "TEST_TOKEN" is typically set by ParaTest

when@prod:
  doctrine:
    orm:
      auto_generate_proxy_classes: false
      proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
