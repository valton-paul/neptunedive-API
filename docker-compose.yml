version: '3'

services:

  db:
    image: mysql:8.0
    container_name: neptunedive-bd
    ports:
      - "3306:3306"
    volumes:
      - ./docker/database/data:/var/lib/mysql
    networks:
      - network
    environment:
      MYSQL_DATABASE: neptunedive
      MYSQL_ROOT_PASSWORD: root

  app:
    build:
      context: .
      dockerfile: ./docker/dockerfile
    container_name: neptunedive-app
    ports:
      - "8000:80"
    networks:
      - network
    depends_on:
      - db
    command: >
      sh -c "
      php bin/console doctrine:migrations:migrate --no-interaction;
      echo 'Application accessible at localhost:8000';
      apache2-foreground
      "

networks:
  network:
    driver: bridge
